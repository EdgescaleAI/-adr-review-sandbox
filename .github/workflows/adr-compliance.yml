name: ADR Compliance (pre-push parity)

# Mirrors the pre-push ADR review hook in CI: per-file Claude review against
# EdgescaleAI ADRs, with each violation turned into an inline PR suggestion.
# Deliberately kept separate from compliance-review.yml (which uses the
# anthropics/claude-code-action pattern and SELECTED_RULES.md).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Claude calls; just list what would be reviewed.'
        required: false
        default: false
        type: boolean

concurrency:
  group: adr-compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adr-review:
    # Skip on forks (secrets aren't available) and when the opt-out label is set.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
       && !contains(github.event.pull_request.labels.*.name, 'skip-adr-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      # Sandbox mode: no engine / Auth0. Inline rules from .github/adr-inline-rules.md
      INLINE_RULES_FILE: .github/adr-inline-rules.md
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_PARALLEL: '4'
      # Guardrails — overridable via repo variables (vars.*) if needed
      ADR_MAX_CHANGED_FILES: ${{ vars.ADR_MAX_CHANGED_FILES || '25' }}
      ADR_MAX_ADDED_LINES: ${{ vars.ADR_MAX_ADDED_LINES || '500' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Verify tools
        run: |
          which claude || { echo "::error::Claude CLI not on PATH"; exit 1; }
          claude --version || true
          jq --version

      - name: Load inline rules (sandbox mode — no engine API call)
        id: adrs
        run: |
          if [[ ! -f "$INLINE_RULES_FILE" ]]; then
            echo "::error::Inline rules file not found at $INLINE_RULES_FILE"
            exit 1
          fi
          RULE_COUNT=$(grep -cE '^### adr-[0-9]+' "$INLINE_RULES_FILE" || echo 0)
          if [[ "$RULE_COUNT" == "0" ]]; then
            echo "::error::No rules found in $INLINE_RULES_FILE"
            exit 1
          fi
          echo "Loaded $RULE_COUNT inline rule(s) from $INLINE_RULES_FILE"
          # Dummy values so existing step conditions don't need changing
          ADR_COUNT=$RULE_COUNT
          echo "ADR count: $ADR_COUNT"
          if [[ "$ADR_COUNT" == "0" || -z "$ADR_COUNT" ]]; then
            echo "::error::No ADRs returned from engine — refusing to review"
            exit 1
          fi
          echo "count=$ADR_COUNT" >> "$GITHUB_OUTPUT"

      - name: Determine changed files
        id: files
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [[ -z "$BASE_REF" ]]; then
            BASE_REF="main"
          fi
          git fetch --no-tags origin "$BASE_REF" || true
          git diff "origin/${BASE_REF}...HEAD" --name-only > /tmp/changed_files.txt || true
          # Filter to files that still exist (skip deletions)
          : > /tmp/review_files.txt
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ -f "$f" ]] && echo "$f" >> /tmp/review_files.txt
          done < /tmp/changed_files.txt
          COUNT=$(wc -l < /tmp/review_files.txt | xargs)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "Changed files ($COUNT):"
          cat /tmp/review_files.txt || true
          # Added lines in the PR diff (for size guardrail)
          ADDED=$(git diff "origin/${BASE_REF}...HEAD" --numstat 2>/dev/null | awk '{a+=$1} END{print a+0}')
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "Added lines: $ADDED"

      - name: Size guardrail
        id: guardrail
        run: |
          set -uo pipefail
          COUNT="${{ steps.files.outputs.count }}"
          ADDED="${{ steps.files.outputs.added }}"
          MAX_FILES="$ADR_MAX_CHANGED_FILES"
          MAX_LINES="$ADR_MAX_ADDED_LINES"
          tripped=false
          reason=""
          if [[ "$DRY_RUN" == "true" ]]; then
            tripped=true
            reason="dry_run=true — Claude calls skipped"
          elif (( COUNT > MAX_FILES )); then
            tripped=true
            reason="PR changes ${COUNT} files, exceeds ADR_MAX_CHANGED_FILES=${MAX_FILES}"
          elif (( ADDED > MAX_LINES )); then
            tripped=true
            reason="PR adds ${ADDED} lines, exceeds ADR_MAX_ADDED_LINES=${MAX_LINES}"
          fi
          if [[ "$tripped" == "true" ]]; then
            pr_ref=""
            if [[ -n "${{ github.event.pull_request.html_url }}" ]]; then
              pr_ref="${{ github.event.pull_request.html_url }}"
            fi
            msg="⚠️ ADR review SKIPPED — ${reason}. ${pr_ref}"
            echo "::warning::$msg"
            {
              echo "## ADR review skipped"
              echo ""
              echo "$msg"
              echo ""
              echo "- Files changed: ${COUNT} (max: ${MAX_FILES})"
              echo "- Added lines:   ${ADDED} (max: ${MAX_LINES})"
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "${{ secrets.ADR_NOTIFICATION_WEBHOOK_URL }}" ]]; then
              payload=$(jq -n --arg t "$msg" '{text: $t}')
              curl -sS -X POST -H "Content-Type: application/json" \
                -d "$payload" "${{ secrets.ADR_NOTIFICATION_WEBHOOK_URL }}" \
                >/dev/null 2>&1 || true
            fi
            echo "GUARDRAIL_TRIPPED=true" >> "$GITHUB_ENV"
          else
            echo "GUARDRAIL_TRIPPED=false" >> "$GITHUB_ENV"
            echo "Guardrail OK: $COUNT/$MAX_FILES files, $ADDED/$MAX_LINES lines."
          fi

      - name: Per-file ADR review (batched parallel)
        if: steps.files.outputs.count != '0' && env.GUARDRAIL_TRIPPED != 'true'
        env:
          BASE_REF: ${{ steps.files.outputs.base_ref }}
        run: |
          set -uo pipefail

          OUTPUT_FILE=/tmp/adr_output.txt
          TMPDIR_REV=$(mktemp -d)
          : > "$OUTPUT_FILE"
          : > /tmp/adr_cost.log    # per-call cost tracker (one USD value per line)
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> "$GITHUB_ENV"
          echo "TMPDIR_REV=$TMPDIR_REV" >> "$GITHUB_ENV"

          # Load inline rules into a variable once (used in every review call)
          INLINE_RULES=$(cat "$INLINE_RULES_FILE")

          declare -a FILE_LIST
          idx=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            idx=$((idx + 1))
            FILE_LIST[$idx]="$file"
          done < /tmp/review_files.txt

          FILE_COUNT=$idx
          echo "Reviewing $FILE_COUNT files ($MAX_PARALLEL in parallel)..."

          review_one() {
            local i="$1"
            local file="${FILE_LIST[$i]}"
            local out="$TMPDIR_REV/$i.out"
            local FILE_DIFF
            FILE_DIFF=$(git diff "origin/${BASE_REF}...HEAD" -- "$file" 2>/dev/null)
            if [[ -z "$FILE_DIFF" ]]; then
              echo "__NODIFF__" > "$out"
              return
            fi
            local prompt_file
            prompt_file=$(mktemp)
            {
              printf '%s\n' "Review this one file's diff against the ADR rules below."
              printf '\n'
              printf '%s\n' "RULES:"
              printf '%s\n' "$INLINE_RULES"
              printf '\n'
              printf '%s\n' "FILE: $file"
              printf '%s\n' "DIFF:"
              printf '%s\n' "$FILE_DIFF"
              printf '\n'
              printf '%s\n' "Output format — one line per violation:"
              printf '%s\n' "BLOCK|adr-id|file:line|description"
              printf '%s\n' "FIX: what to change"
              printf '\n'
              printf '%s\n' "If clean: PASS"
            } > "$prompt_file"
            __raw=$(mktemp)
            if claude -p "$(cat "$prompt_file")" --allowedTools Read,Bash --output-format json >"$__raw" 2>/dev/null && jq -e .result "$__raw" >/dev/null 2>&1; then
              jq -r '.result // ""' "$__raw" > "$out"
              jq -r '.total_cost_usd // 0' "$__raw" >> /tmp/adr_cost.log
            else
              cp "$__raw" "$out" 2>/dev/null || echo "__ERROR__" > "$out"
            fi
            rm -f "$__raw"
            rm -f "$prompt_file"
          }

          print_result() {
            local i="$1"
            local file="${FILE_LIST[$i]}"
            local out="$TMPDIR_REV/$i.out"
            echo "[$i/$FILE_COUNT] $file"
            if [[ ! -s "$out" ]]; then
              echo "    (no output)"
              return
            fi
            local head
            head=$(head -n 1 "$out")
            if [[ "$head" == "__NODIFF__" ]]; then
              echo "    (no diff)"
            elif [[ "$head" == "__ERROR__" ]]; then
              echo "    error during review"
            elif grep -q "^PASS$" "$out"; then
              echo "    clean"
            elif grep -qE '^\**BLOCK\|' "$out"; then
              local v
              v=$(grep -cE '^\**BLOCK\|' "$out")
              echo "    $v violation(s)"
              grep -E '^\**BLOCK\||^FIX:' "$out" | sed 's/^/      /'
              cat "$out" >> "$OUTPUT_FILE"
            else
              echo "    no clear verdict — skipping"
            fi
          }

          batch_num=0
          total_batches=$(( (idx + MAX_PARALLEL - 1) / MAX_PARALLEL ))
          for ((start=1; start<=idx; start+=MAX_PARALLEL)); do
            batch_num=$((batch_num + 1))
            end=$((start + MAX_PARALLEL - 1))
            (( end > idx )) && end=$idx
            echo "── Batch ${batch_num}/${total_batches} (files ${start}-${end}) ──"
            pids=()
            for ((i=start; i<=end; i++)); do
              review_one "$i" &
              pids+=($!)
            done
            wait "${pids[@]}" 2>/dev/null || true
            for ((i=start; i<=end; i++)); do
              print_result "$i"
            done
            echo ""
          done

          if ! grep -qE '^\**BLOCK\|' "$OUTPUT_FILE" 2>/dev/null; then
            echo "ADR compliance check passed."
            echo "block_count=0" >> "$GITHUB_ENV"
            exit 0
          fi

          BLOCK_COUNT=$(grep -cE '^\**BLOCK\|' "$OUTPUT_FILE")
          echo "block_count=$BLOCK_COUNT" >> "$GITHUB_ENV"
          echo "$BLOCK_COUNT violation(s) found."

      - name: Generate patches and build review comments
        if: steps.files.outputs.count != '0' && env.block_count != '0' && env.block_count != ''
        env:
          BASE_REF: ${{ steps.files.outputs.base_ref }}
        run: |
          set -uo pipefail

          COMMENTS_JSON=/tmp/comments.json
          echo "[]" > "$COMMENTS_JSON"

          COMMIT_ID="${{ github.event.pull_request.head.sha }}"
          [[ -z "$COMMIT_ID" ]] && COMMIT_ID=$(git rev-parse HEAD)

          mapfile -t BLOCK_LINES < <(grep -nE '^\**BLOCK\|' "$OUTPUT_FILE" | cut -d: -f1)

          violation_idx=0
          for line_no in "${BLOCK_LINES[@]}"; do
            violation_idx=$((violation_idx + 1))
            block_line=$(sed -n "${line_no}p" "$OUTPUT_FILE")
            fix_line=$(awk -v start="$line_no" 'NR>start && /^FIX:/{print; exit}' "$OUTPUT_FILE")

            # Parse BLOCK|adr-id|file:line|description
            # Trim whitespace without xargs (xargs chokes on unmatched quotes in text)
            adr_id=$(echo "$block_line" | awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}')
            file_line=$(echo "$block_line" | awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); print $3}')
            desc=$(echo "$block_line" | awk -F'|' '{
              s=""; for(i=4;i<=NF;i++) s = s $i (i<NF?"|":"");
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", s); print s
            }')
            v_file=$(echo "$file_line" | awk -F':' '{print $1}')
            v_line=$(echo "$file_line" | awk -F':' '{print $2}' | grep -oE '^[0-9]+' || true)

            if [[ -z "$v_file" || -z "${v_line:-}" || ! -f "$v_file" ]]; then
              echo "Skipping inline comment for violation $violation_idx — could not resolve file:line"
              continue
            fi

            echo ""
            echo "── Violation $violation_idx / ${block_count} ── $v_file:$v_line"
            echo "$block_line"
            [[ -n "$fix_line" ]] && echo "$fix_line"
            echo "Generating patch..."

            PATCH_FILE=$(mktemp)
            patch_prompt=$(mktemp)
            {
              printf '%s\n' "Produce a single unified diff (git diff format) that fixes this ADR violation."
              printf '\n'
              printf '%s\n' "$block_line"
              printf '%s\n' "$fix_line"
              printf '\n'
              printf '%s\n' "Rules:"
              printf '%s\n' "- Output ONLY the patch — no explanation, no markdown fences"
              printf '%s\n' "- Start with 'diff --git a/<file> b/<file>'"
              printf '%s\n' "- Minimal change, only what this violation requires"
              printf '%s\n' "- Do not touch unrelated code or other files"
            } > "$patch_prompt"
            __raw=$(mktemp)
            if claude -p "$(cat "$patch_prompt")" --allowedTools Read,Bash --output-format json >"$__raw" 2>/dev/null && jq -e .result "$__raw" >/dev/null 2>&1; then
              jq -r '.result // ""' "$__raw" > "$PATCH_FILE"
              jq -r '.total_cost_usd // 0' "$__raw" >> /tmp/adr_cost.log
            else
              cp "$__raw" "$PATCH_FILE" 2>/dev/null || : > "$PATCH_FILE"
            fi
            rm -f "$__raw"
            rm -f "$patch_prompt"

            SANITIZED=$(mktemp)
            awk '/^diff --git/{p=1} p' "$PATCH_FILE" > "$SANITIZED"

            # Sentinel marker for dedup across runs — invisible in rendered markdown.
            # Format MUST stay stable: parsed by the Filter net-new comments step.
            sentinel=$(printf '<!-- adr-compliance-bot | path=%s | line=%s | adr=%s -->' \
              "$v_file" "${v_line:-0}" "$adr_id")

            if [[ ! -s "$SANITIZED" ]]; then
              # No patch — post a plain inline comment
              body_text=$(printf '%s\n**%s**: %s\n\n**Fix**: %s' "$sentinel" "$adr_id" "$desc" "$fix_line")
              body=$(jq -Rn --arg b "$body_text" '$b')
              jq --arg path "$v_file" --argjson line "$v_line" --argjson body "$body" \
                '. + [{path:$path, line:$line, side:"RIGHT", body:$body}]' \
                "$COMMENTS_JSON" > "$COMMENTS_JSON.tmp" && mv "$COMMENTS_JSON.tmp" "$COMMENTS_JSON"
              rm -f "$PATCH_FILE" "$SANITIZED"
              continue
            fi

            # Decide: single-file, single-hunk => suggestion block; else fenced diff
            file_headers=$(grep -c '^diff --git' "$SANITIZED" || true)
            hunk_headers=$(grep -c '^@@' "$SANITIZED" || true)

            if [[ "$file_headers" == "1" && "$hunk_headers" == "1" ]]; then
              # Parse the single hunk: @@ -old_start,old_count +new_start,new_count @@
              # Use the NEW-side numbers (side: RIGHT means new file). Using the
              # old-side breaks on newly-added files where old_start=0.
              hunk_header=$(grep -m1 '^@@' "$SANITIZED")
              new_range=$(echo "$hunk_header" | sed -E 's/^@@ -[0-9]+(,[0-9]+)? \+([0-9]+)(,([0-9]+))?.*/\2 \4/')
              new_start=$(echo "$new_range" | awk '{print $1}')
              new_count=$(echo "$new_range" | awk '{print $2}')
              [[ -z "$new_count" ]] && new_count=1

              # Extract post-image hunk body (lines that are ' ' or '+' — not '-')
              suggestion=$(awk '
                /^@@/ { in_hunk=1; next }
                in_hunk {
                  if (substr($0,1,1) == "-") next;
                  if (substr($0,1,1) == " " || substr($0,1,1) == "+") {
                    print substr($0, 2);
                    next;
                  }
                  # end of hunk
                  in_hunk=0;
                }
              ' "$SANITIZED")

              start_line="$new_start"
              end_line=$(( new_start + new_count - 1 ))
              if (( end_line < start_line )); then end_line=$start_line; fi

              body_text=$(printf '%s\n**%s**: %s\n\n**Fix**: %s\n\n```suggestion\n%s\n```' \
                "$sentinel" "$adr_id" "$desc" "$fix_line" "$suggestion")
              body=$(jq -Rn --arg b "$body_text" '$b')

              if (( end_line > start_line )); then
                jq --arg path "$v_file" \
                   --argjson start_line "$start_line" \
                   --argjson line "$end_line" \
                   --argjson body "$body" \
                   '. + [{path:$path, start_line:$start_line, line:$line, start_side:"RIGHT", side:"RIGHT", body:$body}]' \
                   "$COMMENTS_JSON" > "$COMMENTS_JSON.tmp" && mv "$COMMENTS_JSON.tmp" "$COMMENTS_JSON"
              else
                jq --arg path "$v_file" \
                   --argjson line "$line" \
                   --argjson body "$body" \
                   '. + [{path:$path, line:$line, side:"RIGHT", body:$body}]' \
                   "$COMMENTS_JSON" > "$COMMENTS_JSON.tmp" && mv "$COMMENTS_JSON.tmp" "$COMMENTS_JSON"
              fi
            else
              # Multi-hunk / multi-file — fall back to fenced diff in a plain inline comment
              diff_block=$(cat "$SANITIZED")
              body_text=$(printf '%s\n**%s**: %s\n\n**Fix**: %s\n\n```diff\n%s\n```' \
                "$sentinel" "$adr_id" "$desc" "$fix_line" "$diff_block")
              body=$(jq -Rn --arg b "$body_text" '$b')
              jq --arg path "$v_file" --argjson line "$v_line" --argjson body "$body" \
                '. + [{path:$path, line:$line, side:"RIGHT", body:$body}]' \
                "$COMMENTS_JSON" > "$COMMENTS_JSON.tmp" && mv "$COMMENTS_JSON.tmp" "$COMMENTS_JSON"
            fi

            rm -f "$PATCH_FILE" "$SANITIZED"
          done

          echo "COMMENTS_JSON=$COMMENTS_JSON" >> "$GITHUB_ENV"
          echo "COMMIT_ID=$COMMIT_ID" >> "$GITHUB_ENV"

          echo ""
          echo "Built $(jq 'length' "$COMMENTS_JSON") review comment(s)."

      - name: Filter net-new comments (dedup across runs)
        if: github.event_name == 'pull_request' && env.block_count != '' && env.block_count != '0' && env.GUARDRAIL_TRIPPED != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # 1. Fetch existing bot inline comments on this PR (paginated)
          EXISTING_BODIES=$(mktemp)
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | .body]' \
            > "$EXISTING_BODIES" || echo '[]' > "$EXISTING_BODIES"

          # 2. Extract (path, line, adr) tuples from sentinels into a key file
          EXISTING_KEYS=$(mktemp)
          jq -r '.[]
            | capture("adr-compliance-bot \\| path=(?<p>[^|]+) \\| line=(?<l>[0-9]+) \\| adr=(?<a>[^ ]+)")
            | "\(.p|gsub("^[[:space:]]+|[[:space:]]+$"; ""))\t\(.l)\t\(.a)"' \
            "$EXISTING_BODIES" 2>/dev/null | sort -u > "$EXISTING_KEYS" || : > "$EXISTING_KEYS"

          echo "Found $(wc -l < "$EXISTING_KEYS" | xargs) pre-existing bot comment key(s) on this PR."

          # 3. Filter current comments.json — keep only tuples NOT already present
          FILTERED=$(mktemp)
          echo '[]' > "$FILTERED"
          total=$(jq 'length' "$COMMENTS_JSON")
          kept=0; skipped=0
          for ((ci=0; ci<total; ci++)); do
            body=$(jq -r ".[$ci].body" "$COMMENTS_JSON")
            key=$(printf '%s\n' "$body" | \
              sed -nE 's/.*adr-compliance-bot \| path=([^|]+) \| line=([0-9]+) \| adr=([^ ]+).*/\1\t\2\t\3/p' | head -n1 | \
              sed -E 's/^[[:space:]]+//; s/[[:space:]]+(\t)/\1/g')
            if [[ -n "$key" ]] && grep -qxF "$key" "$EXISTING_KEYS"; then
              echo "  skip-existing: $key"
              skipped=$((skipped + 1))
              continue
            fi
            jq ". + [$(jq ".[$ci]" "$COMMENTS_JSON")]" "$FILTERED" > "$FILTERED.tmp" && mv "$FILTERED.tmp" "$FILTERED"
            kept=$((kept + 1))
          done
          mv "$FILTERED" "$COMMENTS_JSON"

          echo "net-new: $kept   skipped (already posted): $skipped   total violations: $total"
          echo "net_new_count=$kept" >> "$GITHUB_ENV"

      - name: Validate comment anchoring (drop unanchorable)
        if: github.event_name == 'pull_request' && env.net_new_count != '' && env.net_new_count != '0' && env.GUARDRAIL_TRIPPED != 'true'
        env:
          BASE_REF: ${{ steps.files.outputs.base_ref }}
        run: |
          set -uo pipefail
          # For each pending comment, confirm its `line` falls inside a +new hunk
          # of its `path` in the PR diff. Drop ones that don't. This replaces the
          # old "retry per-comment as separate reviews" fallback which produced
          # N reviews instead of 1 on failure.
          VALID=$(mktemp); echo '[]' > "$VALID"
          dropped=0
          total=$(jq 'length' "$COMMENTS_JSON")
          for ((ci=0; ci<total; ci++)); do
            c=$(jq -c ".[$ci]" "$COMMENTS_JSON")
            p=$(echo "$c" | jq -r '.path')
            l=$(echo "$c" | jq -r '.line // .start_line // 0')
            if git diff "origin/${BASE_REF}...HEAD" -- "$p" 2>/dev/null | \
               awk -v L="$l" '
                 /^@@/ {
                   if (match($0, /\+([0-9]+)(,([0-9]+))?/, m)) {
                     s=m[1]+0; n=(m[3]!=""?m[3]+0:1);
                     if (L+0 >= s && L+0 < s + n) {found=1}
                   }
                 }
                 END { exit (found ? 0 : 1) }
               '; then
              jq ". + [$c]" "$VALID" > "$VALID.tmp" && mv "$VALID.tmp" "$VALID"
            else
              echo "::warning::drop unanchorable comment: $p:$l"
              dropped=$((dropped + 1))
            fi
          done
          mv "$VALID" "$COMMENTS_JSON"
          VALIDATED=$(jq 'length' "$COMMENTS_JSON")
          echo "validated_count=$VALIDATED" >> "$GITHUB_ENV"
          echo "dropped_unanchorable=$dropped" >> "$GITHUB_ENV"
          echo "validated: $VALIDATED   dropped: $dropped   of $total net-new"

      - name: Post PR review
        if: github.event_name == 'pull_request' && env.validated_count != '' && env.validated_count != '0' && env.GUARDRAIL_TRIPPED != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Inline-only review. No summary body, event=COMMENT so the review
          # doesn't declare a top-level opinion. The PR is blocked via the
          # "Fail if any BLOCKs remain" step's exit 1, not via REQUEST_CHANGES.
          PAYLOAD=$(mktemp)
          jq -n \
            --arg commit_id "$COMMIT_ID" \
            --slurpfile comments "$COMMENTS_JSON" \
            '{commit_id:$commit_id, event:"COMMENT", body:"", comments:$comments[0]}' \
            > "$PAYLOAD"

          echo "Posting review (COMMENT) with ${validated_count} inline comment(s)..."
          if gh api --method POST "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --input "$PAYLOAD"; then
            echo "Review posted successfully."
          else
            # Single fallback: log warning and move on. The adr-review check
            # will still turn red via exit 1 in the next step, so the PR is
            # blocked even without any posted review.
            echo "::warning::Batched POST failed; no inline review posted. Check remains red via exit 1."
          fi

      - name: Report Claude cost for this run
        if: always()
        run: |
          if [[ -s /tmp/adr_cost.log ]]; then
            total=$(awk '{s+=$1} END{printf "%.4f", s+0}' /tmp/adr_cost.log)
            calls=$(wc -l < /tmp/adr_cost.log | xargs)
            msg="💰 Claude usage: ${calls} call(s), total \$${total} USD (reported by Claude Code CLI --output-format json)."
            echo "$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Claude calls recorded (guardrail tripped or dry-run)."
          fi

      - name: Fail if any BLOCKs remain
        if: env.block_count != '' && env.block_count != '0' && env.GUARDRAIL_TRIPPED != 'true'
        run: |
          echo "::error::${block_count} ADR BLOCK violation(s) found — failing the job."
          exit 1
